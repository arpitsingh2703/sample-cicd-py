on:
  push:
    branches:
      - main  # Trigger workflow on pushes to the main branch

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-app:latest

  deploy:
    name: Deploy Container to VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Log in to Docker Hub on VM
            sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            # Pull latest image
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python-app:latest

            # Stop and remove existing container if running
            sudo docker stop python-web-app || true
            sudo docker rm python-web-app || true

            # Run new container
            sudo docker run -d -p 8080:8080 --name python-web-app ${{ secrets.DOCKERHUB_USERNAME }}/python-app:latest

            # Clean up old unused images
            sudo docker image prune -f
