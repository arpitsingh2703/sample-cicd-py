name: Build and Deploy to VM

on:
  push:
    branches:
      - main  # Triggers pipeline on push to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-web-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Authenticate with Docker Hub
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            
            # Pull latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python-web-app:latest
            
            # Stop and remove existing container if running
            docker stop my-web-app || true
            docker rm my-web-app || true
            
            # Run new container
            docker run -d -p 8080:8080 --name my-web-app ${{ secrets.DOCKERHUB_USERNAME }}/python-web-app:latest
            
            # Clean up old/unused Docker images
            docker image prune -f
